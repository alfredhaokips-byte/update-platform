<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listing — Marketplace</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div id="listing-root"></div>
</div>

<div id="bottom-nav-root"></div>

<!-- Chat modal -->
<div class="modal-overlay" id="chat-modal" hidden>
  <div class="modal">
    <button class="close-x" onclick="closeModal('chat-modal')">✕</button>
    <h3 id="chat-modal-title">Chat with seller</h3>
    <p class="sub">Your phone number stays private until you choose to share it.</p>
    <div class="stack-gap">
      <button class="btn btn-outline btn-block" onclick="sendQuickMessage('Hi! Is this still available?')">👋 Hi! Is this still available?</button>
      <button class="btn btn-outline btn-block" onclick="sendQuickMessage('Would you take a slightly lower price?')">💰 Would you take a slightly lower price?</button>
      <button class="btn btn-outline btn-block" onclick="sendQuickMessage('Can we meet this weekend?')">📅 Can we meet this weekend?</button>
    </div>
  </div>
</div>

<!-- Buy now modal -->
<div class="modal-overlay" id="buy-modal" hidden>
  <div class="modal">
    <button class="close-x" onclick="closeModal('buy-modal')">✕</button>
    <h3>Buy now</h3>
    <p class="sub">This sends the seller a message that you'd like to buy at the asking price and lets you arrange payment &amp; pickup in chat. No online payment is processed.</p>
    <div class="stack-gap">
      <button class="btn btn-fill btn-block" onclick="sendBuyNow()">✓ Confirm & message seller</button>
      <button class="btn btn-outline btn-block" onclick="closeModal('buy-modal')">Cancel</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  const listingId = qs("id");
  let listing = null;

  function listingConfidenceItem(isTrue, label) {
    return `<div class="confidence-item ${isTrue ? "yes" : "no"}"><span class="mark">${isTrue ? "✓" : "–"}</span>${escapeHtml(label)}</div>`;
  }

  function requireLoginOr(action) {
    if (!Store.isLoggedIn()) {
      window.location.href = "login.html?redirect=" + encodeURIComponent(window.location.pathname.split("/").pop() + window.location.search);
      return false;
    }
    return action();
  }

  async function renderListing() {
    const root = document.getElementById("listing-root");
    listing = await Store.getListingById(listingId);
    if (!listing) {
      root.innerHTML = backRowHtml("Listing") + `<div class="empty-state"><div class="big">🙈</div><h3>Listing not found</h3><p>It may have been sold or removed.</p></div>`;
      return;
    }
    const seller = getSellerById(listing.sellerId);
    const reviews = await Store.getReviews(listing.sellerId);
    const sellerStats = Store.reviewStats(reviews);
    const trust = await Store.getSellerTrustStats(listing.sellerId).catch(() => ({ responseRatePct: null }));
    document.title = listing.title + " — Marketplace";

    const galleryUrls = listingGalleryUrls(listing);
    const saved = Store.isSaved(listing.id);
    const isMine = Store.isLoggedIn() && Store.getUser().id === listing.sellerId;

    root.innerHTML = `
      ${backRowHtml(null, `<div class="row" style="gap:8px;"><a class="icon-btn" href="help.html?type=${encodeURIComponent("Fake or misleading listing")}&listing=${listing.id}" title="Report this listing">⚑</a><a class="icon-btn" href="javascript:void(0)" onclick="toast('Link copied (demo)')">↗</a></div>`)}
      <div class="detail-wrap">
        <div class="detail-imgs">
          ${galleryUrls.map((url) => `<div class="detail-img"><img src="${url}" alt="${escapeHtml(listing.title)}" /></div>`).join("")}
        </div>
        <div class="row between detail-title-row">
          <p class="detail-title">${escapeHtml(listing.title)}</p>
          <span class="badge badge-new">${listing.condition}</span>
        </div>
        <p class="detail-price">${formatPrice(listing.price)}</p>
        <p class="detail-meta">📍 ${listing.locality}, ${listing.city} · Posted ${timeAgo(listing.createdAt).toLowerCase()} · ${listing.views} views</p>
        <a href="browse.html?cat=${encodeURIComponent(listing.category)}" class="cat-chip" style="display:inline-flex;margin-bottom:14px;">${tagIcon(listing.category)} ${escapeHtml(listing.category)}</a>

        <a href="profile.html?seller=${seller.id}" class="seller-card row">
          <div class="avatar"><img src="${avatarUrl(seller.avatarSeed, 88)}" alt="${escapeHtml(seller.name)}" /></div>
          <div style="flex:1;">
            <p class="seller-name">${escapeHtml(seller.name)}</p>
            <p class="seller-sub">Member since ${seller.memberSince} · ${seller.deals} deal${seller.deals === 1 ? "" : "s"}${trust.responseRatePct !== null ? ` · ${trust.responseRatePct}% response rate` : ""}</p>
            ${sellerStats.count > 0 ? `<p class="seller-sub" style="margin-top:2px;">${starsHtml(sellerStats.avg, 11)} <b style="color:var(--ink-mid);">${sellerStats.avg}</b> (${sellerStats.count} review${sellerStats.count === 1 ? "" : "s"})</p>` : ""}
            <div class="trust-badges-row" style="margin-top:8px;">
              <span class="trust-badge ${seller.emailVerified ? "yes" : "no"}">${seller.emailVerified ? "✓" : "○"} Email</span>
              <span class="trust-badge ${seller.selfieVerified ? "yes" : "pending"}">${seller.selfieVerified ? "✓" : "○"} Selfie</span>
            </div>
          </div>
          ${seller.verified ? `<span class="badge badge-verified">✓ Verified</span>` : `<span class="badge badge-new">New seller</span>`}
        </a>

        <div class="detail-info" style="margin-bottom:16px;">
          <h3 style="font-size:13px;margin-bottom:2px;">Listing confidence</h3>
          <div class="confidence-list">
            ${listingConfidenceItem(listing.images && listing.images.length > 0 && listing.images.every(isPhotoUrl), "Real photos uploaded")}
            ${listingConfidenceItem(!!listing.condition, "Condition disclosed (" + listing.condition + ")")}
            ${listingConfidenceItem(listing.desc && listing.desc.trim().length >= 40, "Description complete")}
            ${listingConfidenceItem(seller.emailVerified || seller.verified, "Seller verified")}
          </div>
        </div>

        <p class="detail-desc">${escapeHtml(listing.desc)}</p>

        <div class="community-box">
          <p class="community-title">💬 Community Q&amp;A</p>
          <div class="thread" id="qa-thread"></div>
          <form class="qa-form" id="qa-form">
            <input type="text" id="qa-input" placeholder="Ask the seller or community a question..." autocomplete="off" />
            <button type="submit" class="btn btn-fill btn-sm">Post</button>
          </form>
        </div>

        ${isMine ? `
          <p style="text-align:center;font-size:13px;color:var(--muted);padding:10px 0;">This is your own listing.</p>
        ` : `
          <div class="cta-row">
            <button class="btn btn-outline" onclick="openModal('chat-modal')">💬 Chat</button>
            <button class="btn btn-fill" onclick="openModal('buy-modal')">Buy now</button>
          </div>
        `}
        <button class="btn btn-outline btn-block" id="save-toggle-btn" style="margin-bottom:8px;" onclick="toggleSaveDetail()">${saved ? "♥ Saved" : "♡ Save listing"}</button>

        <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:8px;">🛡️ Meet in public, inspect before paying, avoid advance payments to unverified sellers.</p>

        <p class="section-title" style="padding:0;margin-top:18px;">More tagged "${escapeHtml(listing.category)}"</p>
        <div class="product-grid" id="similar-grid" style="padding:0;margin-top:10px;"></div>
      </div>
      <div style="height:16px;"></div>
    `;

    const allListings = await Store.getListings();
    const similar = allListings.filter((l) => l.category === listing.category && l.id !== listing.id).slice(0, 4);
    document.getElementById("similar-grid").innerHTML = similar.length
      ? similar.map(listingCardHtml).join("")
      : `<p style="grid-column:1/-1;color:var(--muted);font-size:13px;">No other listings in this category right now.</p>`;

    await renderQA();

    document.getElementById("qa-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("qa-input");
      const text = input.value.trim();
      if (!text) return;
      await requireLoginOr(async () => {
        await Store.postQuestion(listing.id, text);
        input.value = "";
        toast("Question posted");
        await renderQA();
      });
    });
  }

  async function renderQA() {
    const items = await Store.getQA(listing.id);
    const el = document.getElementById("qa-thread");
    if (items.length === 0) {
      el.innerHTML = `<p style="font-size:12.5px;color:var(--muted);">No questions yet — be the first to ask.</p>`;
      return;
    }
    el.innerHTML = items.map((q) => qaItemHtml(q, false)).join("");
  }

  function qaItemHtml(q, isReply) {
    const user = getSellerById(q.userId);
    const flair = user && listing && user.id === listing.sellerId ? "seller" : "";
    const replies = (q.replies || []).map((r) => qaItemHtml(r, true)).join("");
    return `
      <div class="thread-item" style="${isReply ? "margin-left:26px;" : ""}">
        <div class="vote-col">
          <button onclick="voteQA('${q.id}',1)" aria-label="Upvote">▲</button>
          <span class="n">${q.votes}</span>
          <button onclick="voteQA('${q.id}',-1)" aria-label="Downvote">▼</button>
        </div>
        <div class="thread-body">
          <p class="thread-user">${escapeHtml(user ? user.name : "Unknown")} ${flair ? `<span class="flair">· ${escapeHtml(flair)}</span>` : ""}</p>
          <p class="thread-text">${escapeHtml(q.text)}</p>
        </div>
      </div>
      ${replies}
    `;
  }

  async function voteQA(qId, delta) {
    await requireLoginOr(async () => {
      await Store.voteQA(qId, delta);
      await renderQA();
    });
  }

  async function toggleSaveDetail() {
    const isSaved = await Store.toggleSaved(listing.id);
    document.getElementById("save-toggle-btn").textContent = isSaved ? "♥ Saved" : "♡ Save listing";
    toast(isSaved ? "Saved to your list" : "Removed from saved");
  }

  function sendQuickMessage(text) {
    requireLoginOr(async () => {
      await Store.startOrAppendThread(listing, text);
      closeModal("chat-modal");
      toast("Message sent to " + getSellerById(listing.sellerId).name);
    });
  }

  function sendBuyNow() {
    requireLoginOr(async () => {
      await Store.startOrAppendThread(listing, `I'd like to buy "${listing.title}" at the asking price of ${formatPrice(listing.price)}. Let's arrange pickup and payment!`);
      closeModal("buy-modal");
      toast("Buy request sent to " + getSellerById(listing.sellerId).name);
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await initPage(null);
    await renderListing();
  });
</script>
</body>
</html>
