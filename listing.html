<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZRDE5VY8FE"></script>
<script>
  window.dataLayer = window.dataLayer || [];

  gtag('js', new Date());

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="img/favicon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon-180.png" />
<title>Listing — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div id="listing-root"></div>
</div>

<div id="bottom-nav-root"></div>

<!-- Chat modal -->
<div class="modal-overlay" id="chat-modal" hidden>
  <div class="modal">
    <button class="close-x" onclick="closeModal('chat-modal')">✕</button>
    <h3 id="chat-modal-title">Chat with seller</h3>
    <p class="sub">Your phone number stays private until you choose to share it.</p>
    <div class="stack-gap">
      <button class="btn btn-outline btn-block" onclick="sendQuickMessage('Hi! Is this still available?')">👋 Hi! Is this still available?</button>
      <button class="btn btn-outline btn-block" onclick="sendQuickMessage('Would you take a slightly lower price?')">💰 Would you take a slightly lower price?</button>
      <button class="btn btn-outline btn-block" onclick="sendQuickMessage('Can we meet this weekend?')">📅 Can we meet this weekend?</button>
    </div>
  </div>
</div>

<!-- Buy now modal -->
<div class="modal-overlay" id="buy-modal" hidden>
  <div class="modal">
    <button class="close-x" onclick="closeModal('buy-modal')">✕</button>
    <h3>Buy now</h3>
    <p class="sub">This sends the seller a message that you'd like to buy at the asking price and lets you arrange payment &amp; pickup in chat. No online payment is processed.</p>
    <div class="stack-gap">
      <button class="btn btn-fill btn-block" onclick="sendBuyNow()">✓ Confirm & message seller</button>
      <button class="btn btn-outline btn-block" onclick="closeModal('buy-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Full-screen photo/video lightbox -->
<div class="lightbox-overlay" id="lightbox" hidden>
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">✕</button>
  <div class="lightbox-strip" id="lightbox-strip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  const listingId = qs("id");
  let listing = null;
  let galleryUrls = [];

  function listingConfidenceItem(isTrue, label) {
    return `<div class="confidence-item ${isTrue ? "yes" : "no"}"><span class="mark">${isTrue ? "✓" : "–"}</span>${escapeHtml(label)}</div>`;
  }

  function openLightbox(index) {
    const strip = document.getElementById("lightbox-strip");
    strip.innerHTML = galleryUrls.map((url) => `
      <div class="lightbox-slide">
        ${isVideoUrl(url)
          ? `<video src="${url}" controls playsinline></video>`
          : `<img src="${url}" alt="${escapeHtml(listing.title)}" />`}
      </div>
    `).join("");
    document.getElementById("lightbox").hidden = false;
    strip.scrollTo({ left: index * strip.clientWidth });
  }

  function closeLightbox() {
    const lb = document.getElementById("lightbox");
    lb.hidden = true;
    document.getElementById("lightbox-strip").querySelectorAll("video").forEach((v) => v.pause());
  }

  /* Real device share sheet where supported (mobile — this is what actually
     puts WhatsApp/Messages/Instagram etc. in the sheet, with zero
     per-platform integration), a plain clipboard copy everywhere else
     (mainly desktop browsers, which don't implement navigator.share). Both
     paths need `listing` already loaded, so this is only ever wired to
     buttons rendered after renderListing() has run. */
  async function shareListing() {
    const url = `${window.location.origin}${window.location.pathname}?id=${listing.id}`;
    const text = `${listing.title} — ${formatPrice(listing.price)}`;
    if (navigator.share) {
      try {
        await navigator.share({ title: listing.title, text, url });
      } catch (err) {
        if (err.name !== "AbortError") toast("Couldn't open the share sheet — try again");
      }
      return;
    }
    try {
      // Bare URL only — pasting into a browser address bar (unlike a chat
      // app) doesn't auto-linkify, so bundling the title/price text in front
      // of it (as this used to) made the pasted content not navigate as a
      // URL at all in that context.
      await navigator.clipboard.writeText(url);
      toast("Link copied!");
    } catch (err) {
      toast("Couldn't copy the link — try selecting it manually");
    }
  }

  function requireLoginOr(action) {
    if (!Store.isLoggedIn()) {
      window.location.href = "login.html?redirect=" + encodeURIComponent(window.location.pathname.split("/").pop() + window.location.search);
      return false;
    }
    return action();
  }

  async function renderListing() {
    const root = document.getElementById("listing-root");
    listing = await Store.getListingById(listingId);
    if (!listing) {
      root.innerHTML = backRowHtml("Listing") + `<div class="empty-state"><div class="big">🙈</div><h3>Listing not found</h3><p>It may have been sold or removed.</p></div>`;
      return;
    }
    const seller = getSellerById(listing.sellerId);
    const reviews = await Store.getReviews(listing.sellerId);
    const sellerStats = Store.reviewStats(reviews);
    const trust = await Store.getSellerTrustStats(listing.sellerId).catch(() => ({ responseRatePct: null }));
    const vouchStats = await Store.getVouchStats(listing.sellerId, listing.id).catch(() => ({ count: 0 }));
    document.title = listing.title + " — Marketplace";

    galleryUrls = listingGalleryUrls(listing);
    const saved = Store.isSaved(listing.id);
    const isMine = Store.isLoggedIn() && Store.getUser().id === listing.sellerId;
    const canShare = typeof navigator.share === "function";

    root.innerHTML = `
      ${backRowHtml(null, `<div class="row" style="gap:8px;"><a class="icon-btn" href="help.html?type=${encodeURIComponent("Fake or misleading listing")}&listing=${listing.id}" title="Report this listing">⚑</a><button type="button" class="icon-btn" onclick="shareListing()" aria-label="Share" title="Share">↗</button></div>`)}
      <div class="detail-wrap">
        <div class="detail-imgs">
          ${galleryUrls.map((url, i) => `
            <div class="detail-img">
              ${isVideoUrl(url)
                ? `<video src="${url}" controls playsinline></video><button type="button" class="detail-img-expand" onclick="openLightbox(${i})" aria-label="View full screen">⤢</button>`
                : `<img src="${url}" alt="${escapeHtml(listing.title)}" onclick="openLightbox(${i})" />`}
            </div>
          `).join("")}
        </div>
        <div class="row between detail-title-row">
          <p class="detail-title">${escapeHtml(listing.title)}</p>
          <span class="badge badge-new">${listing.condition}</span>
        </div>
        <p class="detail-price">${formatPrice(listing.price)}</p>
        <p class="detail-meta">📍 ${listing.locality}, ${listing.city} · Posted ${timeAgo(listing.createdAt).toLowerCase()} · ${listing.views} views</p>
        <a href="browse.html?cat=${encodeURIComponent(listing.category)}" class="cat-chip" style="display:inline-flex;margin-bottom:14px;">${CATEGORY_ICONS[listing.category] || ""}${escapeHtml(listing.category)}</a>

        <a href="profile.html?seller=${seller.id}" class="seller-card row">
          <div class="avatar">${avatarHtml(seller)}</div>
          <div style="flex:1;">
            <p class="seller-name">${escapeHtml(seller.name)} ${seller.isBusiness ? `<span class="shop-tag">Shop</span>` : ""}</p>
            ${seller.isBusiness && seller.shopName ? `<p class="seller-sub" style="font-weight:700;">${escapeHtml(seller.shopName)}</p>` : ""}
            ${seller.isBusiness && seller.shopDescription ? `<p class="seller-sub" style="font-style:italic;">${escapeHtml(seller.shopDescription)}</p>` : ""}
            ${seller.statusText ? `<p class="seller-sub" style="font-style:italic;">${escapeHtml(seller.statusText)}</p>` : ""}
            <p class="seller-sub">Member since ${seller.memberSince} · ${seller.deals} deal${seller.deals === 1 ? "" : "s"}${trust.responseRatePct !== null ? ` · ${trust.responseRatePct}% response rate` : ""}</p>
            ${sellerStats.count > 0 ? `<p class="seller-sub" style="margin-top:2px;">${starsHtml(sellerStats.avg, 11)} <b style="color:var(--ink-mid);">${sellerStats.avg}</b> (${sellerStats.count} review${sellerStats.count === 1 ? "" : "s"})</p>` : ""}
            <div class="trust-badges-row" style="margin-top:8px;">
              <span class="trust-badge ${seller.emailVerified ? "yes" : "no"}">${seller.emailVerified ? "✓" : "○"} Email</span>
              <span class="trust-badge ${seller.selfieVerified ? "yes" : "pending"}">${seller.selfieVerified ? "✓" : "○"} Selfie</span>
            </div>
          </div>
          ${isSellerVerified(seller) ? `<span class="badge badge-verified">✓ Verified</span>` : `<span class="badge badge-new">Unverified</span>`}
        </a>

        <div class="row between" style="padding:0 0 16px;gap:10px;">
          <span style="font-size:12px;color:var(--muted);">${vouchStats.count === 0 ? "No vouches yet for this item" : `${vouchStats.count} neighbour${vouchStats.count === 1 ? "" : "s"} vouched for this item`}</span>
          ${!isMine ? `<button class="vouch-toggle-btn ${vouchStats.vouched ? "on" : ""}" id="listing-vouch-btn"><span class="vouch-icon">${VOUCH_ICON}</span>${vouchStats.vouched ? "Vouched" : "Vouch"}</button>` : ""}
        </div>

        <div class="detail-info" style="margin-bottom:16px;">
          <h3 style="font-size:13px;margin-bottom:2px;">Listing confidence</h3>
          <div class="confidence-list">
            ${listingConfidenceItem(listing.images && listing.images.length > 0 && listing.images.every(isPhotoUrl), "Real photos or video uploaded")}
            ${listingConfidenceItem(!!listing.condition, "Condition disclosed (" + listing.condition + ")")}
            ${listingConfidenceItem(listing.desc && listing.desc.trim().length >= 40, "Description complete")}
            ${listingConfidenceItem(isSellerVerified(seller), "Seller verified")}
          </div>
        </div>

        <p class="detail-desc">${escapeHtml(listing.desc)}</p>

        <div class="community-box">
          <p class="community-title">💬 Community Q&amp;A</p>
          <div class="thread" id="qa-thread"></div>
          <form class="qa-form" id="qa-form">
            <input type="text" id="qa-input" placeholder="Ask the seller or community a question..." autocomplete="off" />
            <button type="submit" class="btn btn-fill btn-sm">Post</button>
          </form>
        </div>

        ${isMine ? `
          <p style="text-align:center;font-size:13px;color:var(--muted);padding:10px 0;">This is your own listing.</p>
          <button class="btn btn-outline btn-block" style="margin-bottom:8px;" onclick="shareListing()">${canShare ? "↗ Share this listing" : "🔗 Copy link"}</button>
        ` : `
          <div class="cta-row">
            <button class="btn btn-outline" onclick="openModal('chat-modal')">💬 Chat</button>
            <button class="btn btn-fill" onclick="openModal('buy-modal')">Buy now</button>
            ${canShare
              ? `<button class="btn btn-outline" style="flex:0 0 46px;padding:0;" onclick="shareListing()" aria-label="Share" title="Share">↗</button>`
              : `<button class="btn btn-outline" onclick="shareListing()">🔗 Copy link</button>`}
          </div>
        `}
        <button class="btn btn-outline btn-block" id="save-toggle-btn" style="margin-bottom:8px;" onclick="toggleSaveDetail()">${saved ? "♥ Saved" : "♡ Save listing"}</button>

        <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:8px;">🛡️ Meet in public, inspect before paying, avoid advance payments to unverified sellers.</p>

        <p class="section-title" style="padding:0;margin-top:18px;">More tagged "${escapeHtml(listing.category)}"</p>
        <div class="product-grid" id="similar-grid" style="padding:0;margin-top:10px;"></div>
      </div>
      <div style="height:16px;"></div>
    `;

    const allListings = await Store.getListings();
    const similar = allListings.filter((l) => l.category === listing.category && l.id !== listing.id).slice(0, 4);
    document.getElementById("similar-grid").innerHTML = similar.length
      ? similar.map(listingCardHtml).join("")
      : `<p style="grid-column:1/-1;color:var(--muted);font-size:13px;">No other listings in this category right now.</p>`;

    await renderQA();

    document.getElementById("qa-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("qa-input");
      const text = input.value.trim();
      if (!text) return;
      await requireLoginOr(async () => {
        await Store.postQuestion(listing.id, text);
        input.value = "";
        toast("Question posted");
        await renderQA();
      });
    });

    const vouchBtn = document.getElementById("listing-vouch-btn");
    if (vouchBtn) {
      vouchBtn.addEventListener("click", async () => {
        await requireLoginOr(async () => {
          vouchBtn.disabled = true;
          try {
            const nowVouched = await Store.toggleVouch(listing.sellerId, listing.id);
            vouchBtn.classList.toggle("on", nowVouched);
            vouchBtn.innerHTML = `<span class="vouch-icon">${VOUCH_ICON}</span>${nowVouched ? "Vouched" : "Vouch"}`;
            const countEl = vouchBtn.previousElementSibling;
            const stats = await Store.getVouchStats(listing.sellerId, listing.id);
            countEl.textContent = stats.count === 0 ? "No vouches yet for this item" : `${stats.count} neighbour${stats.count === 1 ? "" : "s"} vouched for this item`;
            toast(nowVouched ? "Thanks for vouching" : "Vouch removed");
          } catch (err) {
            toast(err.message || "Couldn't update — try again");
          } finally {
            vouchBtn.disabled = false;
          }
        });
      });
    }
  }

  async function renderQA() {
    const items = await Store.getQA(listing.id);
    const el = document.getElementById("qa-thread");
    if (items.length === 0) {
      el.innerHTML = `<p style="font-size:12.5px;color:var(--muted);">No questions yet — be the first to ask.</p>`;
      return;
    }
    el.innerHTML = items.map((q) => qaItemHtml(q, false)).join("");
  }

  function qaItemHtml(q, isReply) {
    const user = getSellerById(q.userId);
    const flair = user && listing && user.id === listing.sellerId ? "seller" : "";
    const replies = (q.replies || []).map((r) => qaItemHtml(r, true)).join("");
    return `
      <div class="thread-item" style="${isReply ? "margin-left:26px;" : ""}">
        <div class="vote-col">
          <button onclick="voteQA('${q.id}',1)" aria-label="Upvote">▲</button>
          <span class="n">${q.votes}</span>
          <button onclick="voteQA('${q.id}',-1)" aria-label="Downvote">▼</button>
        </div>
        <div class="thread-body">
          <p class="thread-user">${escapeHtml(user ? user.name : "Unknown")} ${flair ? `<span class="flair">· ${escapeHtml(flair)}</span>` : ""}</p>
          <p class="thread-text">${escapeHtml(q.text)}</p>
        </div>
      </div>
      ${replies}
    `;
  }

  async function voteQA(qId, delta) {
    await requireLoginOr(async () => {
      await Store.voteQA(qId, delta);
      await renderQA();
    });
  }

  async function toggleSaveDetail() {
    const isSaved = await Store.toggleSaved(listing.id);
    document.getElementById("save-toggle-btn").textContent = isSaved ? "♥ Saved" : "♡ Save listing";
    toast(isSaved ? "Saved to your list" : "Removed from saved");
  }

  function sendQuickMessage(text) {
    requireLoginOr(async () => {
      await Store.startOrAppendThread(listing, text);
      closeModal("chat-modal");
      toast("Message sent to " + getSellerById(listing.sellerId).name);
    });
  }

  function sendBuyNow() {
    requireLoginOr(async () => {
      await Store.startOrAppendThread(listing, `I'd like to buy "${listing.title}" at the asking price of ${formatPrice(listing.price)}. Let's arrange pickup and payment!`, "buy_interest");
      closeModal("buy-modal");
      toast("Buy request sent to " + getSellerById(listing.sellerId).name);
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await initPage(null);
    await renderListing();
  });
</script>
</body>
</html>
