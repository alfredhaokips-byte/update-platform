<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community — Marketplace</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div id="page-root"></div>
</div>

<div id="bottom-nav-root"></div>

<!-- New post modal -->
<div class="modal-overlay" id="post-modal" hidden>
  <div class="modal">
    <button class="close-x" id="post-modal-close" onclick="closeModal('post-modal')"></button>
    <h3>Start a discussion</h3>
    <p class="sub">Ask the community, share a tip, or start a conversation — not for individual listing questions (use the listing's own Q&amp;A for that).</p>
    <div class="form-row">
      <label>Category</label>
      <div class="chip-select" id="post-cat-chips"></div>
    </div>
    <div class="form-row">
      <label for="post-title">Title</label>
      <input type="text" id="post-title" placeholder="e.g. Best spot in Saket to meet a buyer safely?" maxlength="120" />
    </div>
    <div class="form-row">
      <label for="post-body">Details</label>
      <textarea id="post-body" placeholder="Add context — the more specific, the better the answers." maxlength="1000" style="min-height:100px;"></textarea>
    </div>
    <button class="btn btn-fill btn-block" onclick="submitPost()">Post to community</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  const CATEGORIES_LIST = ["Advice", "Local tips", "General"];
  let activeCat = null; // null = "All"
  let activePostId = null;
  let selectedPostCat = CATEGORIES_LIST[0];

  function timeShort(dateStr) {
    const mins = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
    if (mins < 60) return mins <= 1 ? "just now" : `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return days === 1 ? "1d ago" : `${days}d ago`;
  }

  async function renderList() {
    mountBottomNav("community");
    const posts = await Store.getCommunityPosts(activeCat);
    const root = document.getElementById("page-root");

    root.innerHTML = `
      <div class="page-top" style="padding-top:18px;">
        <div class="row between">
          <p class="chats-title">Community</p>
          <a href="messages.html" class="icon-btn" title="Direct messages" id="msgs-link"></a>
        </div>
      </div>
      <div class="comm-tabs">
        <button class="pill-btn ${activeCat === null ? "active" : ""}" onclick="setCat(null)">All</button>
        ${CATEGORIES_LIST.map((c) => `<button class="pill-btn ${activeCat === c ? "active" : ""}" onclick="setCat('${c}')">${escapeHtml(c)}</button>`).join("")}
      </div>
      <div id="thread-list"></div>
    `;
    document.getElementById("msgs-link").innerHTML = ICONS.reply;

    const listEl = document.getElementById("thread-list");
    if (posts.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="big">${ICONS.community}</div><h3>No discussions yet</h3><p>Be the first to start one.</p></div>`;
      return;
    }
    listEl.innerHTML = posts.map((p) => {
      const author = getSellerById(p.authorId);
      return `
        <button class="thread-card" style="width:calc(100% - 36px);text-align:left;" onclick="openPost('${p.id}')">
          <span class="thread-cat">${escapeHtml(p.category || "General")}</span>
          <div class="thread-top">
            <div class="mini-avatar">${author ? `<img src="${avatarUrl(author.avatarSeed, 52)}" alt="" />` : ""}</div>
            <span class="thread-user">${escapeHtml(author ? author.name : "Someone")}</span>
            <span class="thread-time">${timeShort(p.createdAt)}</span>
          </div>
          <div class="thread-title">${escapeHtml(p.title || "")}</div>
          <div class="thread-body">${escapeHtml(p.body)}</div>
          <div class="thread-foot">
            <span>${ICONS.upvote}${p.votes}</span>
            <span>${ICONS.reply}${p.replyCount} repl${p.replyCount === 1 ? "y" : "ies"}</span>
          </div>
        </button>
      `;
    }).join("");
  }

  function setCat(c) { activeCat = c; renderList(); }

  async function openPost(id) {
    activePostId = id;
    const post = await Store.getCommunityPost(id);
    const root = document.getElementById("page-root");
    if (!post) { root.innerHTML = backRowHtml("Discussion") + `<div class="empty-state">Not found</div>`; return; }

    const author = getSellerById(post.authorId);
    root.innerHTML = `
      ${backRowHtml(null)}
      <div style="padding:0 18px;">
        <span class="thread-cat">${escapeHtml(post.category || "General")}</span>
        <div class="thread-top" style="margin-top:6px;">
          <div class="mini-avatar">${author ? `<img src="${avatarUrl(author.avatarSeed, 52)}" alt="" />` : ""}</div>
          <span class="thread-user">${escapeHtml(author ? author.name : "Someone")}</span>
          <span class="thread-time">${timeShort(post.createdAt)}</span>
        </div>
        <h2 style="font-size:19px;margin:10px 0 8px;">${escapeHtml(post.title || "")}</h2>
        <p style="font-size:14px;color:var(--ink-mid);line-height:1.55;margin-bottom:16px;">${escapeHtml(post.body)}</p>
        <div class="vote-col-h" style="margin-bottom:22px;">
          <button onclick="vote('${post.id}',1)" aria-label="Upvote">${ICONS.upvote}</button>
          <span class="n">${post.votes}</span>
          <button onclick="vote('${post.id}',-1)" aria-label="Downvote" style="transform:rotate(180deg);">${ICONS.upvote}</button>
        </div>
        <p style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;">${post.replies.length} repl${post.replies.length === 1 ? "y" : "ies"}</p>
      </div>
      <div id="replies-list"></div>
      <form id="reply-form" style="padding:14px 18px;display:flex;gap:8px;">
        <input type="text" id="reply-text" placeholder="Add a reply..." autocomplete="off" style="flex:1;border:1.5px solid var(--border-2);border-radius:999px;padding:11px 16px;font-size:13.5px;outline:none;" />
        <button type="submit" class="btn btn-fill btn-sm">Post</button>
      </form>
      <div style="height:20px;"></div>
    `;
    mountBottomNav("community");
    renderReplies(post.replies);

    document.getElementById("reply-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("reply-text");
      const text = input.value.trim();
      if (!text) return;
      if (!Store.isLoggedIn()) { window.location.href = "login.html?redirect=" + encodeURIComponent("community.html"); return; }
      try {
        await Store.postCommunityReply(activePostId, text);
        input.value = "";
        const fresh = await Store.getCommunityPost(activePostId);
        renderReplies(fresh.replies);
        toast("Reply posted");
      } catch (err) { toast(err.message || "Couldn't post reply"); }
    });
  }

  function renderReplies(replies) {
    const el = document.getElementById("replies-list");
    if (replies.length === 0) {
      el.innerHTML = `<p style="padding:0 18px;color:var(--muted);font-size:12.5px;">No replies yet — say something.</p>`;
      return;
    }
    el.innerHTML = replies.map((r) => {
      const author = getSellerById(r.authorId);
      return `
        <div class="reply-card">
          <div class="thread-top" style="margin-bottom:6px;">
            <div class="mini-avatar" style="width:22px;height:22px;">${author ? `<img src="${avatarUrl(author.avatarSeed, 44)}" alt="" />` : ""}</div>
            <span class="thread-user" style="font-size:12px;">${escapeHtml(author ? author.name : "Someone")}</span>
            <span class="thread-time">${timeShort(r.createdAt)}</span>
          </div>
          <p style="font-size:13px;color:var(--ink-mid);line-height:1.5;">${escapeHtml(r.body)}</p>
        </div>
      `;
    }).join("");
  }

  async function vote(id, delta) {
    if (!Store.isLoggedIn()) { window.location.href = "login.html?redirect=" + encodeURIComponent("community.html"); return; }
    try {
      await Store.voteCommunity(id, delta);
      openPost(id);
    } catch (err) { toast(err.message || "Couldn't vote"); }
  }

  function openComposeModal() {
    if (!Store.isLoggedIn()) { window.location.href = "login.html?redirect=" + encodeURIComponent("community.html"); return; }
    document.getElementById("post-title").value = "";
    document.getElementById("post-body").value = "";
    selectedPostCat = CATEGORIES_LIST[0];
    const el = document.getElementById("post-cat-chips");
    el.innerHTML = CATEGORIES_LIST.map((c) => `<label class="opt ${c === selectedPostCat ? "active" : ""}" data-val="${escapeHtml(c)}"><input type="radio" name="post-cat" value="${escapeHtml(c)}" />${escapeHtml(c)}</label>`).join("");
    el.querySelectorAll(".opt").forEach((opt) => {
      opt.addEventListener("click", () => {
        el.querySelectorAll(".opt").forEach((o) => o.classList.remove("active"));
        opt.classList.add("active");
        selectedPostCat = opt.dataset.val;
      });
    });
    openModal("post-modal");
  }

  async function submitPost() {
    const title = document.getElementById("post-title").value.trim();
    const body = document.getElementById("post-body").value.trim();
    if (!title) { toast("Add a title"); return; }
    if (!body) { toast("Add some details"); return; }
    try {
      const id = await Store.postCommunityPost({ category: selectedPostCat, title, body });
      closeModal("post-modal");
      toast("Posted to community");
      openPost(id);
    } catch (err) { toast(err.message || "Couldn't post"); }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await initPage("community");
    document.getElementById("post-modal-close").innerHTML = ICONS.close;

    // Floating compose button, appended once (not rebuilt on list/detail re-renders).
    const fab = document.createElement("button");
    fab.className = "comm-compose";
    fab.innerHTML = ICONS.compose;
    fab.setAttribute("aria-label", "Start a discussion");
    fab.onclick = openComposeModal;
    document.body.appendChild(fab);

    if (qs("post") ) openPost(qs("post"));
    else renderList();
  });
</script>
</body>
</html>
