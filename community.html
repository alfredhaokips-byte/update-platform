<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div id="page-root"></div>
</div>

<div id="bottom-nav-root"></div>

<!-- New post modal -->
<div class="modal-overlay" id="post-modal" hidden>
  <div class="modal">
    <button class="close-x" onclick="closeModal('post-modal')">✕</button>
    <h3 id="post-modal-title">New post</h3>
    <div class="form-row">
      <label for="post-title">Title</label>
      <input type="text" id="post-title" maxlength="120" placeholder="Keep it short and specific" />
    </div>
    <div class="form-row">
      <label for="post-body">Details</label>
      <textarea id="post-body" maxlength="1000" style="min-height:100px;" placeholder="Add context — the more specific, the more useful this is."></textarea>
    </div>
    <button class="btn btn-fill btn-block" onclick="submitPost()">Post</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  const SECTIONS = [
    { key: "general", label: "General" },
    { key: "feedback", label: "Feedback" },
    { key: "notice", label: "Notice Board" },
  ];
  const STATUS_LABELS = { open: "Open", acknowledged: "Acknowledged", fixed: "Fixed", wont_fix: "Won't fix" };
  let activeSection = "general";
  let activePostId = null;

  function timeShort(dateStr) {
    const mins = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
    if (mins < 60) return mins <= 1 ? "just now" : `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return days === 1 ? "1d ago" : `${days}d ago`;
  }

  async function updateMsgDot() {
    if (!Store.isLoggedIn()) return;
    try {
      const threads = await Store.getThreads();
      const unread = threads.reduce((sum, t) => sum + t.unread, 0);
      const dot = document.getElementById("msg-dot");
      if (dot) dot.hidden = unread === 0;
      const navDot = document.getElementById("nav-msg-dot");
      if (navDot) navDot.hidden = unread === 0;
    } catch (e) { /* non-critical */ }
  }

  async function renderList() {
    mountBottomNav("community");
    const root = document.getElementById("page-root");

    // Header/tabs render unconditionally, before the posts fetch — so a
    // missing community_posts table (community.sql not run yet) degrades to
    // an inline message in the list area, not a blank page.
    root.innerHTML = `
      <div class="page-top" style="padding-top:18px;">
        <div class="row between">
          <p class="chats-title">Community</p>
          <a href="messages.html" class="icon-btn" title="Direct messages">🔔<span class="dot" id="msg-dot" hidden></span></a>
        </div>
      </div>
      <div class="comm-tabs">
        ${SECTIONS.map((s) => `<button class="pill-btn ${activeSection === s.key ? "active" : ""}" onclick="setSection('${s.key}')">${s.label}</button>`).join("")}
      </div>
      ${activeSection === "feedback" ? `<p style="padding:0 18px 10px;font-size:12px;color:var(--muted);">Bugs, ideas, and concerns about the app itself — vouch for the ones you agree with.</p>` : ""}
      ${activeSection === "notice" ? `<p style="padding:0 18px 10px;font-size:12px;color:var(--muted);">Announcements from the team, newest first.</p>` : ""}
      <div id="thread-list"><p style="padding:0 18px;color:var(--muted);font-size:13px;">Loading…</p></div>
      <div style="height:80px;"></div>
    `;
    updateMsgDot();
    updateComposeFabVisibility();

    const listEl = document.getElementById("thread-list");
    let posts;
    try {
      posts = await Store.getCommunityPosts(activeSection);
    } catch (err) {
      listEl.innerHTML = `<div class="empty-state"><div class="big">⚠️</div><h3>Community forum isn't set up yet</h3><p>Ask the site owner to run supabase/community.sql.</p></div>`;
      return;
    }
    if (posts.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><div class="big">💬</div><h3>Nothing here yet</h3><p>${activeSection === "notice" ? "Check back for updates." : "Be the first to post."}</p></div>`;
      return;
    }
    const cardFn = activeSection === "notice" ? noticeCardHtml : activeSection === "feedback" ? feedbackCardHtml : threadCardHtml;
    listEl.innerHTML = posts.map(cardFn).join("");
  }

  function setSection(key) { activeSection = key; renderList(); }

  /* The Notice Board is admin-only to post to — regular users shouldn't
     even see a "+" that would just reject them. */
  function updateComposeFabVisibility() {
    const fab = document.getElementById("comm-compose-fab");
    if (!fab) return;
    const user = Store.getUser();
    const blocked = activeSection === "notice" && !(user && user.isAdmin);
    fab.hidden = blocked;
  }

  function threadCardHtml(p) {
    const author = getSellerById(p.authorId);
    return `
      <button class="thread-card" onclick="openPost('${p.id}')">
        <div class="thread-top">
          <div class="mini-avatar">${author ? avatarHtml(author) : ""}</div>
          <span class="thread-user">${escapeHtml(author ? author.name : "Someone")}</span>
          <span class="thread-time">${timeShort(p.createdAt)}</span>
        </div>
        <div class="thread-title">${escapeHtml(p.title || "")}</div>
        <div class="thread-body">${escapeHtml(p.body)}</div>
        <div class="thread-foot">
          <span>▲ ${p.votes}</span>
          <span>💬 ${p.replyCount} repl${p.replyCount === 1 ? "y" : "ies"}</span>
        </div>
      </button>
    `;
  }

  function feedbackCardHtml(p) {
    const author = getSellerById(p.authorId);
    const status = p.status || "open";
    return `
      <button class="thread-card" onclick="openPost('${p.id}')">
        <div class="thread-top">
          <div class="mini-avatar">${author ? avatarHtml(author) : ""}</div>
          <span class="thread-user">${escapeHtml(author ? author.name : "Someone")}</span>
          <span class="thread-time">${timeShort(p.createdAt)}</span>
          <span class="status-chip-sm ${status}">${STATUS_LABELS[status]}</span>
        </div>
        <div class="thread-title">${escapeHtml(p.title || "")}</div>
        <div class="thread-body">${escapeHtml(p.body)}</div>
        <div class="thread-foot">
          <span><span class="vouch-seal-mini">${VOUCH_ICON}</span>${p.votes} vouched</span>
          <span>💬 ${p.replyCount} repl${p.replyCount === 1 ? "y" : "ies"}</span>
        </div>
      </button>
    `;
  }

  function noticeCardHtml(p) {
    return `
      <div class="notice-card">
        <span class="thread-time">${new Date(p.createdAt).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}</span>
        <div class="thread-title" style="margin-top:6px;">${escapeHtml(p.title || "")}</div>
        <div class="thread-body" style="-webkit-line-clamp:initial;">${escapeHtml(p.body)}</div>
      </div>
    `;
  }

  async function openPost(id) {
    activePostId = id;
    const post = await Store.getCommunityPost(id);
    const root = document.getElementById("page-root");
    if (!post) { root.innerHTML = backRowHtml("Post") + `<div class="empty-state">Not found</div>`; return; }

    const author = getSellerById(post.authorId);
    const user = Store.getUser();
    const isAdmin = !!(user && user.isAdmin);
    activeSection = post.section; // keeps the FAB and tab highlight consistent on a deep link
    updateComposeFabVisibility();

    root.innerHTML = `
      ${backRowHtml(null)}
      <div style="padding:0 18px;">
        <div class="thread-top">
          <div class="mini-avatar" style="width:28px;height:28px;">${author ? avatarHtml(author) : ""}</div>
          <span class="thread-user">${escapeHtml(author ? author.name : "Someone")}</span>
          <span class="thread-time">${timeShort(post.createdAt)}</span>
        </div>
        <h2 style="font-size:19px;margin:8px 0;">${escapeHtml(post.title || "")}</h2>
        <p style="font-size:14px;color:var(--ink-mid);line-height:1.55;margin-bottom:16px;">${escapeHtml(post.body)}</p>
        ${post.section === "general" ? `
          <div class="vote-col-h" style="margin-bottom:16px;">
            <button onclick="vote('${post.id}',1)" aria-label="Upvote">▲</button>
            <span class="n">${post.votes}</span>
            <button onclick="vote('${post.id}',-1)" aria-label="Downvote">▼</button>
          </div>
        ` : ""}
        ${post.section === "feedback" ? `
          <div class="row between" style="margin-bottom:16px;gap:10px;">
            <span style="font-size:12px;color:var(--muted);">${post.votes === 0 ? "No vouches yet" : `${post.votes} vouched`}</span>
            <button class="vouch-toggle-btn ${post.myVote === 1 ? "on" : ""}" onclick="vote('${post.id}',1)"><span class="vouch-icon">${VOUCH_ICON}</span>${post.myVote === 1 ? "Vouched" : "Vouch"}</button>
          </div>
        ` : ""}
        ${post.section === "feedback" ? `
          <div style="margin-bottom:16px;">
            ${isAdmin
              ? `<select class="status-select" id="status-select" style="margin-left:0;">
                  ${Object.keys(STATUS_LABELS).map((k) => `<option value="${k}" ${(post.status || "open") === k ? "selected" : ""}>${STATUS_LABELS[k]}</option>`).join("")}
                </select>`
              : `<span class="status-chip-sm ${post.status || "open"}" style="margin-left:0;">${STATUS_LABELS[post.status || "open"]}</span>`}
          </div>
        ` : ""}
        <p style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;">${post.replies.length} repl${post.replies.length === 1 ? "y" : "ies"}</p>
      </div>
      <div id="replies-list"></div>
      <form id="reply-form" style="padding:14px 18px;display:flex;gap:8px;">
        <input type="text" id="reply-text" placeholder="Add a reply..." autocomplete="off" style="flex:1;border:1.5px solid var(--border-2);border-radius:999px;padding:11px 16px;font-size:13.5px;outline:none;background:var(--surface);color:var(--ink);" />
        <button type="submit" class="btn btn-fill btn-sm">Post</button>
      </form>
      <div style="height:20px;"></div>
    `;
    mountBottomNav("community");
    renderReplies(post.replies);

    if (isAdmin && post.section === "feedback") {
      document.getElementById("status-select").addEventListener("change", async (e) => {
        try {
          await Store.setFeedbackStatus(post.id, e.target.value);
          toast("Status updated");
        } catch (err) { toast(err.message || "Couldn't update"); }
      });
    }

    document.getElementById("reply-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("reply-text");
      const text = input.value.trim();
      if (!text) return;
      if (!Store.isLoggedIn()) { window.location.href = "login.html?redirect=" + encodeURIComponent("community.html"); return; }
      try {
        await Store.postCommunityReply(activePostId, text);
        input.value = "";
        const fresh = await Store.getCommunityPost(activePostId);
        renderReplies(fresh.replies);
        toast("Reply posted");
      } catch (err) { toast(err.message || "Couldn't post reply"); }
    });
  }

  function renderReplies(replies) {
    const el = document.getElementById("replies-list");
    if (replies.length === 0) {
      el.innerHTML = `<p style="padding:0 18px;color:var(--muted);font-size:12.5px;">No replies yet.</p>`;
      return;
    }
    el.innerHTML = replies.map((r) => {
      const author = getSellerById(r.authorId);
      return `
        <div class="reply-card">
          <div class="thread-top" style="margin-bottom:4px;">
            <div class="mini-avatar" style="width:20px;height:20px;">${author ? avatarHtml(author) : ""}</div>
            <span class="thread-user" style="font-size:11.5px;">${escapeHtml(author ? author.name : "Someone")}</span>
            <span class="thread-time">${timeShort(r.createdAt)}</span>
          </div>
          <p style="font-size:13px;color:var(--ink-mid);line-height:1.5;">${escapeHtml(r.body)}</p>
        </div>
      `;
    }).join("");
  }

  async function vote(id, delta) {
    if (!Store.isLoggedIn()) { window.location.href = "login.html?redirect=" + encodeURIComponent("community.html"); return; }
    try {
      await Store.voteCommunity(id, delta);
      openPost(id);
    } catch (err) { toast(err.message || "Couldn't vote"); }
  }

  function openComposeModal() {
    if (!Store.isLoggedIn()) { window.location.href = "login.html?redirect=" + encodeURIComponent("community.html"); return; }
    if (activeSection === "notice" && !(Store.getUser() && Store.getUser().isAdmin)) {
      toast("Only the team can post to the Notice Board");
      return;
    }
    document.getElementById("post-title").value = "";
    document.getElementById("post-body").value = "";
    document.getElementById("post-modal-title").textContent =
      activeSection === "feedback" ? "New feedback" : activeSection === "notice" ? "New announcement" : "New discussion";
    openModal("post-modal");
  }

  async function submitPost() {
    const title = document.getElementById("post-title").value.trim();
    const body = document.getElementById("post-body").value.trim();
    if (!title) { toast("Add a title"); return; }
    if (!body) { toast("Add some details"); return; }
    const submitBtn = document.querySelector("#post-modal button.btn-fill");
    submitBtn.disabled = true;
    try {
      await Store.postCommunityPost({ section: activeSection, title, body });
      closeModal("post-modal");
      toast("Posted");
      await renderList(); // back to the list, new post at the top, empty state cleared
    } catch (err) {
      toast(err.message || "Couldn't post — try again");
    } finally {
      submitBtn.disabled = false;
    }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await initPage("community");

    // Floating compose button, appended once (not rebuilt on list/detail re-renders).
    const fab = document.createElement("button");
    fab.id = "comm-compose-fab";
    fab.className = "comm-compose";
    fab.innerHTML = "+";
    fab.setAttribute("aria-label", "New post");
    fab.onclick = openComposeModal;
    document.body.appendChild(fab);

    if (qs("post")) openPost(qs("post"));
    else renderList();
  });
</script>
</body>
</html>
