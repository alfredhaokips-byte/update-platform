<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="img/favicon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon-180.png" />
<title>Reset password — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="back-row row between">
    <a href="login.html" class="icon-btn" aria-label="Back">←</a>
    <span class="header-title">Reset password</span>
    <span style="width:40px;"></span>
  </div>

  <!-- Shown while we wait for supabase-js to pick up the recovery token from
       the URL (it auto-detects on load — see js/supabase-client.js — and
       fires onAuthStateChange("PASSWORD_RECOVERY") once it has). Usually
       resolves near-instantly; the timeout below is only for a bad/expired
       link, where no session ever shows up. -->
  <div class="form-wrap" style="padding-top:20px;" id="checking-step">
    <p style="font-size:13px;color:var(--muted);text-align:center;">Checking your reset link...</p>
  </div>

  <div class="form-wrap" style="padding-top:20px;" id="reset-step" hidden>
    <h3 style="margin-bottom:6px;">Choose a new password</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:18px;">Pick something you haven't used before.</p>
    <form id="reset-form">
      <div class="form-row">
        <label for="f-new-password">New password</label>
        <input type="text" id="f-new-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" style="-webkit-text-security:disc;text-security:disc;" />
      </div>
      <div class="form-row">
        <label for="f-confirm-password">Confirm new password</label>
        <input type="text" id="f-confirm-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" style="-webkit-text-security:disc;text-security:disc;" />
      </div>
      <p id="reset-error" style="color:var(--danger);font-size:13px;margin-bottom:14px;" hidden></p>
      <button type="submit" class="btn btn-fill btn-block" id="reset-btn">Update password</button>
    </form>
  </div>

  <div class="form-wrap" style="padding-top:20px;" id="invalid-step" hidden>
    <h3 style="margin-bottom:6px;">This link isn't valid</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:18px;">It may have expired, or already been used. Request a new one from the sign-in page.</p>
    <a href="login.html" class="btn btn-fill btn-block">Back to sign in</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    requireSupabaseConfigured();

    let resolved = false;
    function showReady() {
      if (resolved) return;
      resolved = true;
      document.getElementById("checking-step").hidden = true;
      document.getElementById("reset-step").hidden = false;
    }
    function showInvalid() {
      if (resolved) return;
      resolved = true;
      document.getElementById("checking-step").hidden = true;
      document.getElementById("invalid-step").hidden = false;
    }

    // A `getSession()` fallback here would be wrong: it can't tell a real
    // recovery session apart from any other already-signed-in session (e.g.
    // someone who's just logged in normally landing on this URL) — that
    // would let a signed-in browser change its password with no real reset
    // token at all. Gate first on the URL actually carrying recovery
    // params, and only then wait for the real signal.
    const hasRecoveryParams = window.location.hash.includes("type=recovery") || new URL(window.location.href).searchParams.has("code");
    if (!hasRecoveryParams) {
      showInvalid();
    } else {
      sb.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") showReady();
      });
      setTimeout(() => { if (!resolved) showInvalid(); }, 2500);
    }

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("reset-error");
      const btn = document.getElementById("reset-btn");
      errEl.hidden = true;

      const pw = document.getElementById("f-new-password").value;
      const pw2 = document.getElementById("f-confirm-password").value;
      if (pw !== pw2) {
        errEl.textContent = "Passwords don't match.";
        errEl.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating...";
      try {
        await Auth.updatePassword(pw);
        await Auth.signOut();
        window.location.href = "login.html";
      } catch (err) {
        errEl.textContent = err.message || "Couldn't update your password — try the reset link again.";
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = "Update password";
      }
    });
  });
</script>
</body>
</html>
