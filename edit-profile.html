<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit profile — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="back-row row between">
    <a href="account.html" class="icon-btn" aria-label="Back">←</a>
    <span class="header-title">Edit profile</span>
    <span style="width:40px;"></span>
  </div>

  <div class="form-wrap" style="padding-top:10px;text-align:center;">
    <!-- Two separate inputs, not one — `capture` reliably restricts a file
         input to camera-only on many mobile browsers instead of adding it
         as an extra option, so relying on a single input for both meant
         gallery selection silently disappeared. -->
    <input type="file" id="f-photo-camera" accept="image/jpeg,image/png,image/webp" capture="environment" hidden />
    <input type="file" id="f-photo-gallery" accept="image/jpeg,image/png,image/webp" hidden />
    <div id="avatar-preview-wrap" style="width:96px;height:96px;border-radius:50%;overflow:hidden;margin:0 auto 12px;background:var(--surface-2);">
      <div id="avatar-preview" style="width:100%;height:100%;"></div>
    </div>
    <div class="row" style="gap:8px;justify-content:center;margin-bottom:10px;">
      <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('f-photo-camera').click()">📷 Take a photo</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('f-photo-gallery').click()">🖼️ Choose from gallery</button>
    </div>
    <p class="hint" style="margin-bottom:22px;">JPG, PNG or WebP, 5MB max.</p>

    <form id="profile-form" style="text-align:left;">
      <div class="form-row">
        <label for="f-status">Status / bio</label>
        <textarea id="f-status" maxlength="140" placeholder="A line about you — optional" style="min-height:70px;"></textarea>
        <div class="hint"><span id="status-count">0</span>/140</div>
      </div>

      <div class="form-row">
        <div class="row between" style="cursor:default;">
          <label for="f-is-business" style="margin:0;">I'm selling as a small business/shop</label>
          <label class="switch">
            <input type="checkbox" id="f-is-business" />
            <span class="switch-track"></span>
          </label>
        </div>
        <div class="hint">Self-declared, like every other label on this app that isn't checked — shows a "Shop" tag next to your name. No different rules, fees, or verification.</div>
      </div>

      <div id="shop-fields" hidden>
        <div class="form-row">
          <label for="f-shop-name">Shop name</label>
          <input type="text" id="f-shop-name" maxlength="60" placeholder="e.g. Corsage" />
        </div>
        <div class="form-row">
          <label for="f-shop-desc">Shop description</label>
          <textarea id="f-shop-desc" maxlength="160" placeholder="e.g. Curated pre-loved fashion, Noida" style="min-height:60px;"></textarea>
          <div class="hint"><span id="shop-desc-count">0</span>/160</div>
        </div>
      </div>

      <button type="submit" class="btn btn-fill btn-block" id="save-btn">Save</button>
    </form>
  </div>
</div>

<div id="bottom-nav-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    await initPage("account");
    const session = await Auth.requireAuth();
    if (!session) return;

    const user = Store.getUser();
    document.getElementById("avatar-preview").innerHTML = avatarHtml(user);
    document.getElementById("f-status").value = user.statusText || "";
    document.getElementById("status-count").textContent = (user.statusText || "").length;

    const businessToggle = document.getElementById("f-is-business");
    const shopFields = document.getElementById("shop-fields");
    businessToggle.checked = user.isBusiness;
    shopFields.hidden = !user.isBusiness;
    document.getElementById("f-shop-name").value = user.shopName || "";
    document.getElementById("f-shop-desc").value = user.shopDescription || "";
    document.getElementById("shop-desc-count").textContent = (user.shopDescription || "").length;
    businessToggle.addEventListener("change", () => { shopFields.hidden = !businessToggle.checked; });
    document.getElementById("f-shop-desc").addEventListener("input", (e) => {
      document.getElementById("shop-desc-count").textContent = e.target.value.length;
    });

    async function handleAvatarPick(e) {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) { toast("JPG, PNG or WebP only"); return; }
      if (file.size > 5 * 1024 * 1024) { toast("Photo must be under 5MB"); return; }
      const previewUrl = URL.createObjectURL(file);
      document.getElementById("avatar-preview").innerHTML = `<img src="${previewUrl}" alt="" style="width:100%;height:100%;object-fit:cover;" />`;
      try {
        await Store.uploadProfilePhoto(file);
        toast("Photo updated");
      } catch (err) {
        toast(err.message || "Couldn't upload — try again");
        document.getElementById("avatar-preview").innerHTML = avatarHtml(user);
      }
    }
    document.getElementById("f-photo-camera").addEventListener("change", handleAvatarPick);
    document.getElementById("f-photo-gallery").addEventListener("change", handleAvatarPick);

    document.getElementById("f-status").addEventListener("input", (e) => {
      document.getElementById("status-count").textContent = e.target.value.length;
    });

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("save-btn");
      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        await Store.setStatusText(document.getElementById("f-status").value);
        await Store.setSellerType({
          isBusiness: businessToggle.checked,
          shopName: document.getElementById("f-shop-name").value,
          shopDescription: document.getElementById("f-shop-desc").value,
        });
        toast("Profile updated");
        window.location.href = "account.html";
      } catch (err) {
        toast(err.message || "Couldn't save — try again");
        btn.disabled = false;
        btn.textContent = "Save";
      }
    });
  });
</script>
</body>
</html>
