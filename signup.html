<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="back-row row between">
    <a href="index.html" class="icon-btn" aria-label="Back">←</a>
    <span class="header-title">Create account</span>
    <span style="width:40px;"></span>
  </div>

  <div class="form-wrap" style="padding-top:20px;" id="signup-step">
    <form id="signup-form">
      <div class="form-row">
        <label for="f-name">Name</label>
        <input type="text" id="f-name" placeholder="Your name" required autocomplete="name" />
      </div>
      <div class="form-row">
        <label for="f-email">Email</label>
        <input type="text" id="f-email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-row">
        <label for="f-password">Password</label>
        <input type="text" id="f-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" style="-webkit-text-security:disc;text-security:disc;" />
      </div>
      <div class="form-row" style="position:relative;">
        <label for="f-locality">Locality (optional — you can set this later)</label>
        <input type="text" id="f-locality" placeholder="Start typing an area or city..." autocomplete="off" />
        <div class="map-preview" id="map-preview" hidden></div>
      </div>
      <p id="signup-error" style="color:var(--danger);font-size:13px;margin-bottom:14px;" hidden></p>
      <button type="submit" class="btn btn-fill btn-block" id="signup-btn">Create account</button>
    </form>
    <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:18px;">
      Already have an account? <a href="login.html" style="color:var(--ink);font-weight:700;">Sign in</a>
    </p>
  </div>

  <!-- Email OTP confirmation step — DORMANT, not deleted. Removed from the
       live flow because Resend (the transactional email provider backing
       every email this app sends) requires a verified sending domain to
       reach real signups; no domain has been bought yet, so OTP codes only
       ever reached the Resend account's own address, not real users. Needs,
       to re-enable:
         1. Buy + verify a domain in Resend (Resend → Domains).
         2. Supabase Dashboard → Authentication → Providers → Email →
            switch "Confirm email" back ON.
         3. Uncomment this block and its matching JS below.
       See README for the full writeup. -->
  <!--
  <div class="form-wrap" style="padding-top:20px;" id="otp-step" hidden>
    <h3 style="margin-bottom:6px;">Check your email</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:18px;">We sent a 6-digit code to <b id="otp-email-echo"></b> — enter it below to confirm your account.</p>
    <form id="otp-form">
      <div class="form-row">
        <label for="f-otp">Code</label>
        <input type="text" id="f-otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" required
          style="letter-spacing:0.3em;font-size:20px;text-align:center;font-weight:700;" />
      </div>
      <p id="otp-error" style="color:var(--danger);font-size:13px;margin-bottom:14px;" hidden></p>
      <button type="submit" class="btn btn-fill btn-block" id="otp-btn">Confirm</button>
    </form>
    <button type="button" id="resend-otp-btn" class="btn btn-outline btn-block" style="margin-top:10px;">Resend code</button>
  </div>
  -->

  <!-- Optional, always-skippable character step, shown right after account creation. -->
  <div class="form-wrap" style="padding-top:20px;" id="char-step" hidden>
    <h3 style="margin-bottom:6px;">One last thing — who's saying hello?</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:18px;">Pick how you'd like to show up. This sets your profile character only — nothing else, and you can change it any time from Account.</p>
    <div class="char-grid" id="char-grid"></div>
    <button type="button" class="btn btn-outline btn-block" id="skip-char-btn" style="margin-top:18px;">Skip for now</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/maps-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  let selectedPlace = null; // { locality, city, state, lat, lng } from location search
  let pendingEmail = null;
  let pendingName = null;

  document.addEventListener("DOMContentLoaded", async () => {
    requireSupabaseConfigured();

    const localityInput = document.getElementById("f-locality");
    const mapPreview = document.getElementById("map-preview");
    mountPlacesAutocomplete(localityInput, (place) => {
      selectedPlace = place;
      mountLeafletMap(mapPreview, place.lat, place.lng, { zoom: 13 });
    });
    localityInput.addEventListener("input", () => { selectedPlace = null; mapPreview.hidden = true; });

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("signup-error");
      const btn = document.getElementById("signup-btn");
      errEl.hidden = true;

      const typedLocality = localityInput.value.trim();
      if (typedLocality && !selectedPlace) {
        errEl.textContent = "Please pick a locality from the suggestions, or clear the field to skip it.";
        errEl.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";
      try {
        const email = document.getElementById("f-email").value.trim();
        const name = document.getElementById("f-name").value.trim();
        await Auth.signUp({
          name,
          email,
          password: document.getElementById("f-password").value,
          place: selectedPlace,
        });
        pendingEmail = email;
        pendingName = name;
        await Store.primeCache(); // needed for Store.setAvatarType() on the next step

        // Best-effort — a failed welcome email should never block signup.
        try {
          await sb.functions.invoke("send-welcome-email", { body: { email, name } });
        } catch (mailErr) { /* non-critical */ }

        document.getElementById("signup-step").hidden = true;
        showCharStep();
      } catch (err) {
        errEl.textContent = err.message || "Couldn't create your account — try again.";
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = "Create account";
      }
    });

    /* Email OTP confirmation — DORMANT, not deleted. See the matching HTML
       comment above #otp-step for why (no verified Resend sending domain
       yet) and the steps to re-enable. Re-enabling: uncomment this block,
       uncomment #otp-step above, and change the signup-form handler above
       to call showOtpStep(email) instead of going straight to
       Store.primeCache()/showCharStep().
    function showOtpStep(email) {
      document.getElementById("signup-step").hidden = true;
      document.getElementById("otp-step").hidden = false;
      document.getElementById("otp-email-echo").textContent = email;
      document.getElementById("f-otp").focus();
    }

    document.getElementById("otp-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("otp-error");
      const btn = document.getElementById("otp-btn");
      errEl.hidden = true;
      btn.disabled = true;
      btn.textContent = "Confirming...";
      try {
        await Auth.verifyOtp({ email: pendingEmail, token: document.getElementById("f-otp").value.trim() });
        await Store.primeCache(); // needed for Store.setAvatarType() on the next step

        // Best-effort — a failed welcome email should never block signup.
        try {
          await sb.functions.invoke("send-welcome-email", { body: { email: pendingEmail, name: pendingName } });
        } catch (mailErr) { /* non-critical * / }

        document.getElementById("otp-step").hidden = true;
        showCharStep();
      } catch (err) {
        errEl.textContent = err.message || "That code didn't work — check it and try again.";
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = "Confirm";
      }
    });

    document.getElementById("resend-otp-btn").addEventListener("click", async () => {
      const resendBtn = document.getElementById("resend-otp-btn");
      resendBtn.disabled = true;
      try {
        await Auth.resendOtp({ email: pendingEmail });
        toast("New code sent");
      } catch (err) {
        toast(err.message || "Couldn't resend — try again shortly");
      } finally {
        resendBtn.disabled = false;
      }
    });
    */

    const CHARACTER_OPTIONS = [
      { type: "female", label: "Female" },
      { type: "male", label: "Male" },
      { type: "neutral", label: "Prefer not to say" },
    ];

    function goToRedirect() {
      window.location.href = qs("redirect") || "index.html";
    }

    function showCharStep() {
      document.getElementById("char-step").hidden = false;
      const el = document.getElementById("char-grid");
      el.innerHTML = CHARACTER_OPTIONS.map((opt) => `
        <div class="char-card" data-type="${opt.type}">
          <div class="char-avatar">${characterAvatarHtml(opt.type)}</div>
          <div class="label">${opt.label}</div>
          <div class="sub">${opt.type === "neutral" ? "Neutral character" : "Assigns your character"}</div>
        </div>
      `).join("");
      el.querySelectorAll(".char-card").forEach((card) => {
        card.addEventListener("click", async () => {
          try {
            await Store.setAvatarType(card.dataset.type);
          } catch (err) { /* cosmetic only — never block signup on this */ }
          goToRedirect();
        });
      });
      document.getElementById("skip-char-btn").addEventListener("click", goToRedirect);
    }
  });
</script>
</body>
</html>
