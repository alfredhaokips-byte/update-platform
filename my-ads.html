<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My ads — Marketplace</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="page-top" style="padding-top:18px;">
    <div class="row between">
      <p class="chats-title">My ads</p>
      <a href="post-ad.html" class="icon-btn">➕</a>
    </div>
  </div>

  <div class="product-grid" id="my-grid"></div>
  <div class="empty-state" id="empty-state" hidden>
    <div class="big">📋</div>
    <h3>You haven't posted anything yet</h3>
    <p>List your first item and reach buyers nearby.</p>
    <a href="post-ad.html" class="btn btn-fill" style="margin-top:14px;">+ Post an ad</a>
  </div>
  <div style="height:24px;"></div>
</div>

<div id="bottom-nav-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    await initPage("myads");
    const session = await Auth.requireAuth();
    if (!session) return;

    const allListings = await Store.getListings();
    const listings = allListings.filter((l) => l.sellerId === Store.getUser().id);
    const grid = document.getElementById("my-grid");
    const empty = document.getElementById("empty-state");
    if (listings.length === 0) { empty.hidden = false; }
    else { grid.innerHTML = listings.map(listingCardHtml).join(""); }
  });
</script>
</body>
</html>
