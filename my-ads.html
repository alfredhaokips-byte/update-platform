<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My ads — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="page-top" style="padding-top:18px;">
    <div class="row between">
      <p class="chats-title">My ads</p>
      <a href="post-ad.html" class="icon-btn">➕</a>
    </div>
  </div>

  <div class="product-grid" id="my-grid"></div>
  <div class="empty-state" id="empty-state" hidden>
    <div class="big">📋</div>
    <h3>You haven't posted anything yet</h3>
    <p>List your first item and reach buyers nearby.</p>
    <a href="post-ad.html" class="btn btn-fill" style="margin-top:14px;">+ Post an ad</a>
  </div>
  <div style="height:24px;"></div>
</div>

<div id="bottom-nav-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    await initPage(null); // no longer a bottom-nav tab — reachable from Account
    const session = await Auth.requireAuth();
    if (!session) return;

    const allListings = await Store.getListings();
    const listings = allListings.filter((l) => l.sellerId === Store.getUser().id);
    const grid = document.getElementById("my-grid");
    const empty = document.getElementById("empty-state");
    if (listings.length === 0) { empty.hidden = false; }
    else { grid.innerHTML = listings.map(myAdCardHtml).join(""); }
  });

  function myAdCardHtml(listing) {
    return `
      <a href="listing.html?id=${listing.id}" class="product-card">
        <div class="product-img">
          ${listingThumbHtml(listing, 400, 340)}
          <span class="cond-tag">${listing.condition}</span>
          <button class="save-btn" title="Delete listing" onclick="handleDeleteClick(event, '${listing.id}')">🗑</button>
        </div>
        <div class="product-body">
          <p class="product-title">${escapeHtml(listing.title)}</p>
          <p class="product-price">${formatPrice(listing.price)}</p>
          <p class="product-tag">${escapeHtml(listing.category)}</p>
        </div>
      </a>
    `;
  }

  async function handleDeleteClick(evt, id) {
    evt.preventDefault();
    evt.stopPropagation();
    if (!confirm("Delete this listing? This can't be undone.")) return;
    const card = evt.currentTarget.closest(".product-card");
    try {
      await Store.deleteListing(id);
      card.remove();
      if (!document.querySelector("#my-grid .product-card")) document.getElementById("empty-state").hidden = false;
      toast("Listing deleted");
    } catch (err) {
      toast(err.message || "Couldn't delete — try again");
    }
  }
</script>
</body>
</html>
